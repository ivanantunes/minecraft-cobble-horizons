name: Cleanup duplicated 1.8.4 experiment branch

on:
  push:
    branches:
      - feature/1.3.0-living-horizons
    paths:
      - .github/workflows/cleanup-1.8-experiment.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR 4 was merged into development (never master)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$GITHUB_REPOSITORY" = 'ivanantunes/minecraft-cobble-horizons'
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/4" --jq '[.merged_at, .base.ref, .head.ref] | @tsv')
          echo "$pr"
          printf '%s\n' "$pr" | grep -Fq $'feature/1.3.0-living-horizons\texperiment/1.3.0-cobblemon-1.8.4'
          gh api "repos/$GITHUB_REPOSITORY/pulls/4" --jq '.merged' | grep -qx true
      - name: Delete redundant experiment branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/experiment/1.3.0-cobblemon-1.8.4"
          echo 'Only the 1.3.0 development branch remains for feature work.'
