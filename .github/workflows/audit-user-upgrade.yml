name: Audit user-updated Cobblemon 1.8.4 modpack

on:
  push:
    branches:
      - feature/1.3.0-living-horizons
    paths:
      - scripts/audit_user_upgrade.py
      - docs/migration-1.8.4-upload-inventory.json
      - .github/workflows/audit-user-upgrade.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit 69 uploaded Modrinth mod versions and inspect Fabric metadata
        run: python scripts/audit_user_upgrade.py
      - name: Store full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-upgrade-fabric-dependency-report
          path: docs/migration-1.8.4-audit-results.json
          if-no-files-found: warn
