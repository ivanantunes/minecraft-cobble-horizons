name: Inspect published v1.2.0 MRPack

on:
  push:
    branches:
      - feature/1.3.0-living-horizons
    paths:
      - .github/workflows/inspect-v1.2-baseline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the official GitHub Release asset
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/ivanantunes/minecraft-cobble-horizons/releases/download/v1.2.0/CobbleHorizons.1.2.0.mrpack \
            -o /tmp/cobblehorizons-v1.2.0.mrpack
          test -s /tmp/cobblehorizons-v1.2.0.mrpack
      - name: Inventory content and compare first-party source
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import zipfile
          from collections import Counter

          pack = pathlib.Path('/tmp/cobblehorizons-v1.2.0.mrpack')
          with zipfile.ZipFile(pack) as archive:
              names = archive.namelist()
              manifest = json.loads(archive.read('modrinth.index.json'))
              roots = Counter(name.split('/')[0] for name in names)
              first_party = [name for name in names if (
                  '/datapacks/CobbleHorizons-Progression/' in name
                  or '/datapacks/CobbleHorizons-QuestZ/' in name
              ) and not name.endswith('/')]
              report = {
                  'release_sha256': hashlib.sha256(pack.read_bytes()).hexdigest(),
                  'release_size': pack.stat().st_size,
                  'archive_entries': len(names),
                  'root_directories': dict(roots),
                  'dependencies': manifest.get('dependencies', {}),
                  'manifest_file_count': len(manifest.get('files', [])),
                  'first_party_entries': len(first_party),
                  'first_party_paths': first_party,
              }
              print('BASELINE SUMMARY')
              print(json.dumps({k: v for k, v in report.items() if k != 'first_party_paths'}, indent=2))
              print('FIRST PARTY PATHS (first 80)')
              print('\n'.join(first_party[:80]))
              print('ARCHIVE DATAPACK-RELATED PATHS (first 100)')
              print('\n'.join(n for n in names if 'datapack' in n.lower())[:14000])
              pathlib.Path('baseline-inventory.json').write_text(json.dumps(report, indent=2))
          PY
      - name: Upload provenance and inventory report
        uses: actions/upload-artifact@v4
        with:
          name: v1.2.0-baseline-inventory
          path: baseline-inventory.json
