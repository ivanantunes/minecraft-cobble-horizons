name: Build CobbleHorizons 1.3.0 Alpha 2 - Cobblemon 1.8.4

on:
  push:
    branches:
      - feature/1.3.0-living-horizons
    paths:
      - scripts/build_alpha_1_8_4.py
      - scripts/build_questz_hotfix.py
      - scripts/build_alpha_mrpack.py
      - docs/migration-1.8.4-upload-inventory.json
      - docs/alpha2-shaderpack-pins.json
      - config/cobbledollars/default_shop.json
      - datapacks/**
      - .github/workflows/build-alpha-1.8.4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpha2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test validator and shop configuration
        run: python -m unittest discover -s tests -v
      - name: Download official SHA-pinned v1.2.0 MRPack
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/ivanantunes/minecraft-cobble-horizons/releases/download/v1.2.0/CobbleHorizons.1.2.0.mrpack \
            -o /tmp/CobbleHorizons-v1.2.0.mrpack
          echo 'fccfeb290946191c30f6c5e2783fc90e3564e04b36d3794d8c666d73ce57a40a  /tmp/CobbleHorizons-v1.2.0.mrpack' | sha256sum -c -
      - name: Build pinned 1.8.4 alpha.2 MRPack
        run: |
          python scripts/build_alpha_1_8_4.py \
            --baseline /tmp/CobbleHorizons-v1.2.0.mrpack --repo . \
            --output dist/CobbleHorizons-1.3.0-alpha.2-Cobblemon-1.8.4.mrpack \
            --report dist/alpha2-build-report.json
      - name: Restore legacy QuestZ 1.0.1 from verified v1.2.0
        run: |
          python scripts/build_questz_hotfix.py \
            --alpha2 dist/CobbleHorizons-1.3.0-alpha.2-Cobblemon-1.8.4.mrpack \
            --baseline /tmp/CobbleHorizons-v1.2.0.mrpack \
            --output dist/CobbleHorizons-1.3.0-alpha.2.1-QuestZ-Fix.mrpack \
            --report dist/questz-hotfix-report.json
      - name: Strict datapack and MRPack validation
        run: |
          python scripts/validate_pack.py --source . \
            --mrpack dist/CobbleHorizons-1.3.0-alpha.2.1-QuestZ-Fix.mrpack \
            --output dist/alpha2-audit.json
      - name: Upload alpha 2 for manual Minecraft tests only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CobbleHorizons-1.3.0-alpha.2.1-QUESTZ-FIX-TEST
          path: |
            dist/CobbleHorizons-1.3.0-alpha.2.1-QuestZ-Fix.mrpack
            dist/alpha2-build-report.json
            dist/questz-hotfix-report.json
            dist/alpha2-audit.json
          retention-days: 14

# Do not publish to Modrinth or merge until runtime and save migration pass.
